apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fixboard
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/gloriabenedict/fixboard-ci.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: fixboard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
      - CreateNamespace=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: backend
      jsonPointers:
        - /spec/replicas
